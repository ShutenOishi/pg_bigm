name: Windows CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve supported PostgreSQL versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      upstream_repository: ${{ steps.meta.outputs.upstream_repository }}
      upstream_ref: ${{ steps.meta.outputs.upstream_ref }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Resolve maintained PostgreSQL versions
        id: meta
        shell: pwsh
        run: |
          $config = Get-Content "config/postgresql.json" -Raw | ConvertFrom-Json
          $today = [DateTime]::UtcNow.Date

          $supported = @(
            $config.postgresql | Where-Object {
              [DateTime]::ParseExact(
                $_.eol,
                "yyyy-MM-dd",
                [Globalization.CultureInfo]::InvariantCulture
              ).Date -ge $today
            }
          )

          if ($supported.Count -eq 0) {
            throw "No maintained PostgreSQL versions remain in config/postgresql.json."
          }

          $matrix = @{ include = $supported } | ConvertTo-Json -Compress -Depth 8
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "upstream_repository=$($config.upstream.repository)" >> $env:GITHUB_OUTPUT
          "upstream_ref=$($config.upstream.ref)" >> $env:GITHUB_OUTPUT
          "upstream_version=$($config.upstream.version)" >> $env:GITHUB_OUTPUT

          Write-Host "Build matrix: $matrix"

  build:
    name: PostgreSQL ${{ matrix.major }} / Windows x64
    needs: matrix
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Check out official pg_bigm source
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.matrix.outputs.upstream_repository }}
          ref: ${{ needs.matrix.outputs.upstream_ref }}
          path: upstream

      - name: Verify upstream license matches repository license
        shell: pwsh
        run: |
          $repoLicense = (Get-FileHash "LICENSE" -Algorithm SHA256).Hash
          $upstreamLicense = (Get-FileHash "upstream/LICENSE" -Algorithm SHA256).Hash

          if ($repoLicense -ne $upstreamLicense) {
            throw "LICENSE differs from the pinned upstream pg_bigm source."
          }

      - name: Install PostgreSQL ${{ matrix.major }}
        shell: pwsh
        run: |
          $package = "${{ matrix.chocolateyPackage }}"
          $version = "${{ matrix.chocolateyVersion }}"
          $testPort = "${{ matrix.testPort }}"

          & choco install $package "--version=$version" --yes --no-progress --params "/Password:postgres"
          $code = $LASTEXITCODE

          if (@(0, 1641, 3010) -notcontains $code) {
            throw "Chocolatey failed with exit code $code."
          }

          $pgRoot = Join-Path $env:ProgramFiles "PostgreSQL\${{ matrix.major }}"

          if (-not (Test-Path "$pgRoot\include\server\postgres.h")) {
            throw "PostgreSQL server headers were not found: $pgRoot\include\server\postgres.h"
          }

          if (-not (Test-Path "$pgRoot\lib\postgres.lib")) {
            throw "PostgreSQL import library was not found: $pgRoot\lib\postgres.lib"
          }

          "PGROOT=$pgRoot" >> $env:GITHUB_ENV
          "PGPORT=$testPort" >> $env:GITHUB_ENV

      - name: Configure and build pg_bigm
        shell: pwsh
        run: |
          & ".\windows\ci\build.ps1" \
            -PgRoot $env:PGROOT \
            -UpstreamDir (Join-Path $PWD "upstream")
      - name: Install extension into test PostgreSQL
        shell: pwsh
        run: |
          & ".\windows\ci\install.ps1" \
            -PgRoot $env:PGROOT \
            -UpstreamDir (Join-Path $PWD "upstream")
      - name: Smoke test
        shell: pwsh
        run: |
          & ".\windows\ci\smoke-test.ps1" \
            -PgRoot $env:PGROOT \
            -PgPort ([int]$env:PGPORT) \
            -PostgreSqlMajor ([int]"${{ matrix.major }}")
      - name: Package
        shell: pwsh
        run: |
          & ".\windows\ci\package.ps1" \
            -UpstreamDir (Join-Path $PWD "upstream") \
            -UpstreamRepository "${{ needs.matrix.outputs.upstream_repository }}" \
            -UpstreamRef "${{ needs.matrix.outputs.upstream_ref }}" \
            -UpstreamVersion "${{ needs.matrix.outputs.upstream_version }}" \
            -PostgreSqlMajor ([int]"${{ matrix.major }}") \
            -PostgreSqlMinor "${{ matrix.minor }}"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg_bigm-pg${{ matrix.major }}-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/heads/release/')
    needs:
      - matrix
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: pg_bigm-pg*-windows-x64
          path: dist
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum ./*.zip > SHA256SUMS.txt
          cd ..

          tag="${GITHUB_REF_NAME#release/}"

          cat > release-notes.md <<EOF
          # pg_bigm Windows x64 binaries

          ## English

          These are **unofficial Windows x64 binaries** of pg_bigm, built from upstream \`${{ needs.matrix.outputs.upstream_repository }}\` at \`${{ needs.matrix.outputs.upstream_ref }}\`.

          Every ZIP is compiled and smoke-tested on GitHub Actions against the PostgreSQL major version in its filename, including \`CREATE EXTENSION pg_bigm\` and a basic GIN-index search. The build matrix includes only PostgreSQL versions whose configured community EOL date has not passed.

          ### Documentation

          - [English README](https://github.com/$GITHUB_REPOSITORY/blob/main/README.md)
          - [pg_bigm 1.2 Official Documentation (English)](https://github.com/pgbigm/pg_bigm/blob/REL1_2_STABLE/docs/pg_bigm_en.md)
          - [Japanese README / 日本語README](https://github.com/$GITHUB_REPOSITORY/blob/main/README_ja.md)
          - [Windows x64 guide (Japanese) / Windows x64 バイナリ利用ガイド](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/windows_ja.md)

          For pg_bigm behavior, SQL APIs, configuration, limitations, and licensing, the upstream pg_bigm documentation and license remain authoritative.

          ### File verification

          Use the attached \`SHA256SUMS.txt\` to verify the SHA-256 digest of each ZIP.

          ---

          ## 日本語

          [pg_bigm](https://github.com/pgbigm/pg_bigm) の **非公式 Windows x64 バイナリ**です。
          公式ソース \`${{ needs.matrix.outputs.upstream_repository }}\` の \`${{ needs.matrix.outputs.upstream_ref }}\` を使用してビルドしています。

          各ZIPは、ファイル名に記載されたPostgreSQLメジャーバージョンに対してGitHub Actions上でコンパイルし、\`CREATE EXTENSION pg_bigm\` とGINインデックスを使った基本検索のスモークテストを実施しています。ビルド対象は、設定済みのコミュニティEOL日を過ぎていないPostgreSQLだけです。

          ### ドキュメント

          - [日本語README](https://github.com/$GITHUB_REPOSITORY/blob/main/README_ja.md)
          - [Windows x64 バイナリ利用ガイド（日本語）](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/windows_ja.md)
          - [pg_bigm 1.2 公式ドキュメント（日本語）](https://github.com/pgbigm/pg_bigm/blob/REL1_2_STABLE/docs/pg_bigm.md)

          pg_bigm本体の機能仕様、SQL API、設定、制限事項、およびライセンスについては公式pg_bigmのドキュメントとライセンスを正規の情報源としてください。

          ### ファイル検証

          Releaseに添付した \`SHA256SUMS.txt\` で各ZIPのSHA-256を確認できます。
          EOF

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing Release notes: $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            echo "Creating Release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              dist/*.zip \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
