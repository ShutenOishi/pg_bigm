name: Step 6 Permission Boundary Probe

on:
  push:
    branches:
      - step6-artifact-attestation

permissions:
  contents: read

jobs:
  normal_probe:
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@b5fc97c2e10cf58af2dc15a6c75551ee6677e9ce
    with:
      extension_config_path: config/extension-step6-probe.json

  attested_probe:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@b5fc97c2e10cf58af2dc15a6c75551ee6677e9ce
    with:
      extension_config_path: config/extension-step6-probe.json
