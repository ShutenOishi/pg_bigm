name: Step 6 Final Artifact Attestation Probe

on:
  push:
    branches:
      - step6-artifact-attestation

permissions:
  contents: read

jobs:
  provenance_probe:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/build-extension-attested.yml@6f1aedc6cea34f63f383d28844c556dd908b004d
    with:
      extension_config_path: config/extension-step6-final-probe.json
